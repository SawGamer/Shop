# Full local stack: `docker compose up --build`, then open http://localhost:3000
#
#   storefront   http://localhost:3000   Next.js shop + /admin
#   backend      http://localhost:8080   REST API, Swagger UI at /swagger-ui.html
#   mailpit      http://localhost:8025   catches every email the shop sends
#   storage      http://localhost:9001   S3-compatible object storage console (RustFS)
#   meilisearch  http://localhost:7700   search engine
#
# Infrastructure only (run backend/storefront from your IDE instead):
#   docker compose up postgres redis meilisearch storage mailpit
name: za-shop

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 30

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]

  redis:
    image: redis:7-alpine
    # Carts live here: persist them and never evict them silently.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]

  meilisearch:
    image: getmeili/meilisearch:v1.56.1
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key-change-me}
      MEILI_NO_ANALYTICS: "true"
    ports: ["7700:7700"]
    volumes: [meili-data:/meili_data]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:7700/health"]

  storage:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-shopdev}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-shopdev-secret-key}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["9000:9000", "9001:9001"]
    volumes: [storage-data:/data]

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports: ["1025:1025", "8025:8025"]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/shop
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-shop}
      REDIS_URL: redis://redis:6379
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY:-dev-master-key-change-me}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      STOREFRONT_URL: ${STOREFRONT_URL:-http://localhost:3000}
      MEDIA_PROVIDER: s3
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-shopdev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-shopdev-secret-key}
      S3_BUCKET: shop-media
      S3_CREATE_BUCKET: "true"
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:9000/shop-media}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SHOP_ADMIN_EMAIL: ${SHOP_ADMIN_EMAIL:-admin@za-shop.local}
      SHOP_ADMIN_PASSWORD: ${SHOP_ADMIN_PASSWORD:-admin12345}
      SHOP_DEMO_CUSTOMER_EMAIL: ${SHOP_DEMO_CUSTOMER_EMAIL:-customer@za-shop.local}
      SHOP_DEMO_CUSTOMER_PASSWORD: ${SHOP_DEMO_CUSTOMER_PASSWORD:-customer12345}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      meilisearch: { condition: service_healthy }
      storage: { condition: service_started }
      mailpit: { condition: service_started }

  storefront:
    build: ./storefront
    environment:
      API_URL: http://backend:8080
      COOKIE_SECURE: "false" # plain http on localhost
    ports: ["3000:3000"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  meili-data:
  storage-data:
