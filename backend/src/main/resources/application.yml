# Defaults are for local development (see docker-compose.yml). Every value can be overridden with an
# environment variable, e.g. SPRING_DATASOURCE_URL or SHOP_PAYMENTS_PROVIDER.
spring:
  application:
    name: za-shop
  threads:
    virtual:
      enabled: true # Java 21 virtual threads: thousands of concurrent requests without a big thread pool
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/shop}
    username: ${DATABASE_USER:shop}
    password: ${DATABASE_PASSWORD:shop}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema
    properties:
      hibernate:
        default_batch_fetch_size: 64
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    problemdetails:
      enabled: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false # created by Flyway (V1)
      completion-mode: delete
      republish-outstanding-events-on-restart: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/problem+json

management:
  server:
    port: ${MANAGEMENT_PORT:8081} # keep metrics/health off the public port
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: za-shop

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

shop:
  currency: EUR
  storefront-url: ${STOREFRONT_URL:http://localhost:3000}
  shipping:
    flat-rate-cents: 495
    free-threshold-cents: 5000
  identity:
    issuer: za-shop
    jwt-private-key: ${JWT_PRIVATE_KEY_LOCATION:}
    jwt-public-key: ${JWT_PUBLIC_KEY_LOCATION:}
    cors-allowed-origins: ${STOREFRONT_URL:http://localhost:3000}
    bootstrap-users:
      - email: ${SHOP_ADMIN_EMAIL:admin@za-shop.local}
        password: ${SHOP_ADMIN_PASSWORD:admin12345}
        first-name: Shop
        last-name: Admin
        admin: true
      - email: ${SHOP_DEMO_CUSTOMER_EMAIL:}
        password: ${SHOP_DEMO_CUSTOMER_PASSWORD:}
        first-name: Demo
        last-name: Customer
        admin: false
  media:
    provider: ${MEDIA_PROVIDER:local}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:8080/media}
    local:
      directory: ${MEDIA_LOCAL_DIRECTORY:./data/media}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:eu-central-1}
      bucket: ${S3_BUCKET:shop-media}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style: ${S3_PATH_STYLE:true}
      create-bucket: ${S3_CREATE_BUCKET:false}
  search:
    meilisearch:
      url: ${MEILISEARCH_URL:http://localhost:7700}
      api-key: ${MEILISEARCH_API_KEY:dev-master-key-change-me}
      index: products
  payments:
    provider: ${PAYMENT_PROVIDER:fake}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  notifications:
    from-address: ${MAIL_FROM:no-reply@za-shop.local}
  settings:
    name: ${SHOP_NAME:Z&A}
  seed:
    enabled: ${SEED_DEMO_DATA:true}
    # Which demo catalog to load into an empty database: footwear, electronics, grocery, home or beauty.
    # The shop's initial design matches it; admins can switch the design later.
    catalog: ${SHOP_DEMO_CATALOG:footwear}
